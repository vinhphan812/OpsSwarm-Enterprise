name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'services/forecasting/**'
      - 'tests/e2e/**'
      - '.github/workflows/api.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'services/forecasting/**'
      - 'tests/e2e/**'
      - '.github/workflows/api.yml'
      - 'package.json'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type-check
        run: pip install mypy && mypy retailtwin_api --ignore-missing-imports

      - name: Stockout risk tests
        working-directory: services/forecasting
        run: python -m mypy risk --ignore-missing-imports && python -m pytest

      - name: Run tests with coverage
        run: pytest --cov=retailtwin_api --cov-report=term --cov-report=xml --cov-branch

      - name: Check branch coverage threshold
        run: python check_branch_threshold.py

      - name: Enforce critical-path coverage policy
        run: python enforce_critical_path_coverage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

      - name: Coverage summary
        run: |
          echo "## API Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest --cov=retailtwin_api --cov-report=term 2>&1 | tail -20 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E smoke suite
        run: pytest tests/e2e/ -v --tb=short
