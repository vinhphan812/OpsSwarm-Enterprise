name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'services/forecasting/**'
      - 'services/simulation/**'
      - 'tests/e2e/**'
      - '.github/workflows/api.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'services/forecasting/**'
      - 'services/simulation/**'
      - 'tests/e2e/**'
      - '.github/workflows/api.yml'
      - 'package.json'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type-check
        run: pip install mypy && mypy retailtwin_api --ignore-missing-imports

      - name: Stockout risk tests
        working-directory: services/forecasting
        run: python -m mypy risk --ignore-missing-imports && python -m pytest

      - name: Demand forecast tests
        working-directory: services/forecasting
        run: python -m mypy demand --ignore-missing-imports && python -m pytest

      - name: Simulation KPI tests with coverage
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/services/simulation:${{ github.workspace }}/services/forecasting/risk
        run: |
          python -m mypy services/simulation/kpi --ignore-missing-imports
          pytest \
            --cov=retailtwin_api \
            --cov=services/forecasting/risk \
            --cov=services/simulation \
            --cov-report=term \
            --cov-report=xml:apps/api/coverage.xml \
            --cov-branch \
            --no-cov-on-fail \
            services/simulation/tests/

      - name: Run tests with coverage
        working-directory: ${{ github.workspace }}
        run: |
          pytest \
            --cov=retailtwin_api \
            --cov=services/forecasting/risk \
            --cov=services/simulation \
            --cov-report=term \
            --cov-report=xml:apps/api/coverage.xml \
            --cov-branch \
            --cov-append \
            apps/api/tests/

      - name: Check branch coverage threshold
        run: python check_branch_threshold.py

      - name: Enforce critical-path coverage policy
        working-directory: ${{ github.workspace }}
        run: python apps/api/enforce_critical_path_coverage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage.xml

      - name: Coverage summary
        run: |
          echo "## API Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest --cov=retailtwin_api --cov-report=term 2>&1 | tail -20 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-test
    # Only run if GCP_DEPLOY_SA variable is set (configure via repo Settings → Actions Variables)
    if: github.event_name == 'pull_request' && vars.GCP_DEPLOY_SA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: us-central1-docker.pkg.dev/retailtwin-ai-511002/retailtwin/retailtwin-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: retailtwin-api
          region: us-central1
          image: us-central1-docker.pkg.dev/retailtwin-ai-511002/retailtwin/retailtwin-api:${{ github.sha }}
          service_account: ${{ env.RETAILTWIN_RUNTIME_SA }}
          port: 8080
          memory: 512Mi
          cpu: 1
          max_instances: 10
          min_instances: 0
          timeout: 60

      - name: Health check
        run: |
          curl -sf "https://${{ env.CLOUD_RUN_URL }}/health" || exit 1

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E smoke suite
        run: pytest tests/e2e/ -v --tb=short
