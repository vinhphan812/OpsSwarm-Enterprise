name: CI (Required Checks)

# Top-level merge gate: runs on every PR/push with no path filter.
# This workflow provides stable required-check names regardless of which
# files change, avoiding the path-filter / required-check deadlock.
#
# Required checks for branch protection on main:
#   - Repository Hygiene
#   - API Build & Test  (conditional: runs only when API paths change)
#   - API E2E Smoke      (conditional: runs only when API paths change)
#   - Web Build & Test   (conditional: runs only when Web paths change)
#
# See CI_CONTRACT.md for the full contract.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# ADR 0026 — least-privilege default. This workflow only reads source
# and uploads artifacts, so `contents: read` is enough.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect changed files ─────────────────────────────────────────────────────
  # Runs first to determine which code paths need testing.
  #
  # contracts_changed logic (reviewer finding #2):
  #   Set TRUE only when a file under the documented contract paths changes.
  #   The "contracts/" directory is the single authoritative source of truth
  #   for API<->Web contract boundaries (schemas, API types, shared enums).
  #   Matching an API or Web surface pattern does NOT make contracts_changed
  #   true by itself — both conditions must hold independently.
  detect-changes:
    name: Detect Changed Files
    runs-on: [self-hosted, Linux, X64]
    outputs:
      api_changed: ${{ steps.changes.outputs.api_changed }}
      web_changed: ${{ steps.changes.outputs.web_changed }}
      contracts_changed: ${{ steps.changes.outputs.contracts_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        run: |
          set -euo pipefail

          # ── Collect changed file list ──────────────────────────────────────────
          # From git, not the REST API: the PR files endpoint returned no list on
          # this private repository, so every PR skipped API and Web tests.
          # The checkout has full history (fetch-depth: 0).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null) || CHANGED_FILES=""
          else
            # push to main — compare against its parent
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null) || CHANGED_FILES=""
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          # Fail closed: when the list cannot be determined, run every gate.
          if [ -z "$CHANGED_FILES" ]; then
            echo "::warning::Changed files could not be determined; running API and Web gates."
            echo "api_changed=true" >> $GITHUB_OUTPUT
            echo "web_changed=true" >> $GITHUB_OUTPUT
            echo "contracts_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Path pattern sets ─────────────────────────────────────────────────
          # API_PATTERNS  — any file under these paths triggers API Build & Test.
          # Web_PATTERNS  — any file under these paths triggers Web Build & Test.
          # CONTRACT_PATHS — the authoritative contract boundary directory.
          #                 Changing a file here means both API and Web CI run
          #                 AND contracts_changed is TRUE.
          API_PATTERNS="apps/api services/forecasting services/simulation tests/e2e .github/workflows/api.yml .github/workflows/ci.yml"
          WEB_PATTERNS="apps/web .github/workflows/web.yml .github/workflows/ci.yml"
          CONTRACT_PATHS="contracts/"

          API_CHANGED="false"
          WEB_CHANGED="false"
          CONTRACTS_CHANGED="false"

          # ── REVIEWER FINDING #1 fix ──────────────────────────────────────────
          # REPLACED the broken "break 2" early-exit loops.
          # Each file is now evaluated against ALL three pattern sets independently.
          # A mixed (API+Web) PR is correctly detected because we never terminate
          # the outer loop early.
          for file in $CHANGED_FILES; do
            for pattern in $API_PATTERNS; do
              if [[ "$file" == $pattern* ]]; then
                API_CHANGED="true"
                break  # matched API — no need to re-check other API patterns
              fi
            done

            for pattern in $WEB_PATTERNS; do
              if [[ "$file" == $pattern* ]]; then
                WEB_CHANGED="true"
                break
              fi
            done

            for path in $CONTRACT_PATHS; do
              if [[ "$file" == $path* ]]; then
                # Shared contract changes require both surface gates.
                API_CHANGED="true"
                WEB_CHANGED="true"
                CONTRACTS_CHANGED="true"
                break
              fi
            done

            echo "  $file  api=$API_CHANGED  web=$WEB_CHANGED  contracts=$CONTRACTS_CHANGED"
          done

          echo ""
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "contracts_changed=$CONTRACTS_CHANGED" >> $GITHUB_OUTPUT
          echo "API changed: $API_CHANGED"
          echo "Web changed: $WEB_CHANGED"
          echo "Contracts changed: $CONTRACTS_CHANGED"

  # ── Fast hygiene gate ────────────────────────────────────────────────────────
  # Always runs. No path filter — catches any file, including docs-only changes.
  repository-hygiene:
    name: Repository Hygiene
    runs-on: [self-hosted, Linux, X64]
    # Always run this job regardless of changes
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for merge-conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)' -- ':(exclude).git/MERGE_MSG' 2>/dev/null; then
            echo "::error::Unresolved merge-conflict markers found."
            exit 1
          fi
          echo "No merge-conflict markers."

      - name: Validate workflow YAML files
        run: |
          # Install yamllint in an isolated venv — avoids mutating system Python
          # on shared self-hosted runners. pipx is preferred if available.
          if command -v pipx &> /dev/null; then
            pipx install yamllint
          elif [ ! -d "${RUNNER_TEMP}/yamllint-venv" ]; then
            python3 -m venv "${RUNNER_TEMP}/yamllint-venv"
            "${RUNNER_TEMP}/yamllint-venv/bin/pip" install --quiet yamllint
          fi
          VIRTUAL_ENV="${RUNNER_TEMP}/yamllint-venv" PATH="${RUNNER_TEMP}/yamllint-venv/bin:$PATH" \
            python3 -m yamllint -c /dev/stdin .github/workflows/ << 'YAML'
          extends: default
          rules:
            line-length: disable
            trailing-spaces: disable
            indentation:
              spaces: 2
            comments-indentation: disable
            document-start: disable
            truthy: disable
            new-line-at-end-of-file: disable
            new-lines: disable
          YAML

      - name: Check for committed secrets / credential patterns
        run: |
          # Patterns that must never appear in production source.
          # Lockfiles are excluded because npm integrity hashes look like
          # base64 secrets. Tests are excluded because they use fixtures.
          SECRET_PATTERNS=(
            "AKIA[0-9A-Z]{16}"
            "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
            "password[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}['\"]"
            "api[_-]?key[[:space:]]*=[[:space:]]*['\"][^'\"]{16,}['\"]"
          )
          VIOLATIONS=0
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if git grep -l -E "$pattern" \
              -- ':!*.lock' ':!package-lock.json' ':!yarn.lock' ':!pnpm-lock.yaml' \
              ':!.github/workflows/*.yml' ':!docs/**' ':!**/tests/**' ':!**/*.test.*' ':!**/*_test.*' \
              2>/dev/null | grep -qv '^$'; then
              echo "::error::Secret pattern matched: $pattern"
              git grep -n -E "$pattern" \
                -- ':!*.lock' ':!package-lock.json' ':!yarn.lock' ':!pnpm-lock.yaml' \
                ':!.github/workflows/*.yml' ':!docs/**' ':!**/tests/**' ':!**/*.test.*' ':!**/*_test.*' \
                2>/dev/null || true
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::$VIOLATIONS secret pattern violation(s) found."
            exit 1
          fi
          echo "No committed secrets detected."

      - name: Check for .env files committed to repo
        run: |
          # .env.example is a committed template. Real env files are not.
          ENVIRED=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.env\.(example|sample|template)$' || true)
          if [ -n "$ENVIRED" ]; then
            echo "::error::Committed .env file(s): $ENVIRED"
            exit 1
          fi
          echo "No committed .env files."

  # ── API Build & Test ─────────────────────────────────────────────────────────
  api-build-test:
    name: API Build & Test
    runs-on: [self-hosted, Linux, X64]
    needs: [detect-changes]
    # Run when API paths changed or on push to main
    if: |
      github.event_name == 'push' ||
      needs.detect-changes.outputs.api_changed == 'true'

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type-check
        run: pip install mypy && mypy retailtwin_api --ignore-missing-imports

      - name: Stockout risk tests
        working-directory: services/forecasting
        run: python -m mypy risk --ignore-missing-imports && python -m pytest

      - name: Demand forecast tests
        working-directory: services/forecasting
        run: python -m mypy demand --ignore-missing-imports && python -m pytest

      - name: Run tests with coverage
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
        run: pytest --cov=retailtwin_api --cov-report=term --cov-report=xml:apps/api/coverage.xml --cov-branch apps/api/tests/

      - name: Simulation KPI tests with coverage
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/services/simulation:${{ github.workspace }}/services/forecasting/risk
        run: |
          python -m mypy services/simulation/kpi --ignore-missing-imports
          pytest \
            --cov=retailtwin_api \
            --cov=services/forecasting/risk \
            --cov=services/simulation \
            --cov-report=term \
            --cov-report=xml:apps/api/coverage.xml \
            --cov-branch \
            --cov-append \
            --no-cov-on-fail \
            services/simulation/tests/

      - name: Check branch coverage threshold
        run: python check_branch_threshold.py

      - name: Enforce critical-path coverage policy
        working-directory: ${{ github.workspace }}
        run: python apps/api/enforce_critical_path_coverage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

      - name: Coverage summary
        run: |
          echo "## API Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest --cov=retailtwin_api --cov-report=term 2>&1 | tail -20 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── API E2E Smoke ──────────────────────────────────────────────────────────
  api-e2e-smoke:
    name: API E2E Smoke
    runs-on: [self-hosted, Linux, X64]
    needs: [detect-changes, repository-hygiene, api-build-test]
    # Run when API paths changed or on push to main
    if: |
      github.event_name == 'push' ||
      needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E smoke suite
        run: pytest tests/e2e/ -v --tb=short

  # ── Web Build & Test ─────────────────────────────────────────────────────────
  web-build-test:
    name: Web Build & Test
    runs-on: [self-hosted, Linux, X64]
    needs: [detect-changes]
    # Run when Web paths changed or on push to main
    if: |
      github.event_name == 'push' ||
      needs.detect-changes.outputs.web_changed == 'true'

    defaults:
      run:
        working-directory: apps/web

    # Job level, so the validation step and the build see the same value.
    env:
      VITE_API_BASE_URL: ${{ vars.FIREBASE_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is not set. Add FIREBASE_API_BASE_URL to repo Variables."
            exit 1
          fi
          if echo "$VITE_API_BASE_URL" | grep -q "localhost\|127.0.0.1"; then
            echo "ERROR: VITE_API_BASE_URL must not point to localhost"
            exit 1
          fi
          echo "Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"

      - name: TypeScript & build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 14

      - name: Coverage summary
        run: |
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat apps/web/coverage/coverage-summary.json 2>/dev/null || cat apps/web/coverage/text-summary.txt 2>/dev/null || echo "(run npm run test:coverage locally for details)"
          echo '```' >> $GITHUB_STEP_SUMMARY
