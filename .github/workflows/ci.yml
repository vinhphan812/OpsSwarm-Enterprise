name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependency-lock:
    name: Verify dependency lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify dependency sources and lock structure
        run: python scripts/verify_dependency_lock.py

      - name: Reproduce the checked-in lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip-tools==7.5.2
          cp requirements.lock requirements.lock.committed
          export CUSTOM_COMPILE_COMMAND="pip-compile requirements.txt --generate-hashes --no-emit-index-url --no-emit-trusted-host --strip-extras --output-file=requirements.lock"
          python -m piptools compile \
            --generate-hashes \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --strip-extras \
            --output-file requirements.lock \
            requirements.txt
          diff --unified requirements.lock.committed requirements.lock

  quality:
    name: Python ${{ matrix.python-version }} quality gates
    needs: dependency-lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and quality tooling
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check opsswarm/commands.py opsswarm/policy.py opsswarm/webhook.py

      - name: Type check
        run: python -m mypy

      - name: Run test suite
        run: python -m pytest -q

  coverage:
    name: Coverage enforcement
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and quality tooling
        run: python -m pip install -e '.[dev]'

      - name: Run test suite with coverage
        run: >-
          python -m pytest
          --cov=opsswarm
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build distributions
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install build tooling
        run: python -m pip install 'build>=1.2,<2'

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
