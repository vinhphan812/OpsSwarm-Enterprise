name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependency-lock:
    name: Verify dependency lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependency-lock verifier tooling
        run: python -m pip install 'packaging==25.0'  # Keep aligned with the dev extra.

      - name: Verify dependency sources and lock structure
        run: python scripts/verify_dependency_lock.py

      # NOTE: strict lock reproduction is intentionally omitted here.
      # The structural integrity check (verify_dependency_lock.py) confirms
      # that all direct constraints are satisfied by the pinned graph; it does
      # NOT regenerate or diff the full transitive closure. This is by design:
      # requirements.lock was generated on Windows; uvloop and other
      # platform-specific packages are omitted there but added by pip-tools
      # on Linux, making a deterministic cross-platform diff inherently
      # unreliable. See docs/adr/ADR-008_DEPENDENCY_LOCK_RELEASE_POLICY.md
      # (ADR-008-1) for the rationale and the full lock-file strategy.

  ha-postgres:
    name: HA PostgreSQL schema and concurrency
    needs: dependency-lock
    runs-on: ubuntu-latest
    env:
      OPSWARM_CONFIG: config/test.yaml
      # The HA schema tests reset the ``public`` schema, so the target must be
      # a disposable database.  The test harness refuses any database whose
      # name does not contain "test".
      #
      # The service container runs with trust authentication: it is an
      # ephemeral, network-isolated CI instance that holds no data worth
      # protecting, and no credential needs to be written into the workflow.
      HA_TEST_DATABASE_URL: postgresql://opsswarm@localhost:5432/opsswarm_ha_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: opsswarm
          POSTGRES_DB: opsswarm_ha_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsswarm -d opsswarm_ha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and quality tooling
        run: python -m pip install -e '.[dev]'

      # ADR-031 Test 1 asks for a real PostgreSQL migration/upgrade/downgrade
      # log.  The upgrade/downgrade cycle is exercised here as a first-class
      # step so the log is part of the CI evidence rather than an assertion
      # buried inside a test run.
      #
      # HA_DATABASE_URL deliberately keeps the documented bare
      # ``postgresql://`` form so this step also proves the documented
      # invocation works against the installed driver.
      - name: Capture the Alembic upgrade and downgrade log
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export HA_DATABASE_URL="$HA_TEST_DATABASE_URL"
          {
            echo "### alembic upgrade head"
            python -m alembic upgrade head
            echo "### alembic current"
            python -m alembic current
            echo "### alembic downgrade -1"
            python -m alembic downgrade -1
            echo "### alembic upgrade head (re-apply)"
            python -m alembic upgrade head
          } 2>&1 | tee artifacts/ha-migration.log

      - name: Upload the HA migration log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ha-migration-log
          path: artifacts/ha-migration.log
          if-no-files-found: error
          retention-days: 30

      # These suites require a live PostgreSQL server; without the service
      # container above they would silently skip, which is why the job exists.
      - name: Run the HA schema, migration and concurrency suites
        run: >-
          python -m pytest
          tests/integration/test_ha_schema_postgres.py
          tests/faults/test_ha_lease_concurrency_postgres.py
          -v --junitxml=test-results/ha-postgres.xml

      - name: Upload the HA PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ha-postgres-results
          path: test-results/ha-postgres.xml
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Python ${{ matrix.python-version }} quality gates
    needs: dependency-lock
    runs-on: ubuntu-latest
    env:
      OPSWARM_CONFIG: config/test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and quality tooling
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check opsswarm/commands.py opsswarm/policy.py opsswarm/webhook.py

      - name: Type check
        run: python -m mypy

      - name: Unit and contract layers
        run: python -m pytest tests/unit tests/contracts -q

      - name: Integration layer
        run: python -m pytest tests/integration -q

      - name: Fault layer
        run: python -m pytest tests/faults -q

      - name: Real-boundary E2E layer
        run: python -m pytest tests/e2e -q

      - name: Smoke layer
        run: python -m pytest tests/smoke -q

      - name: Security test layer
        run: python -m pytest tests/security -q

      - name: Publish layer results
        if: always()
        run: |
          mkdir -p test-results
          python -m pytest tests/unit tests/contracts tests/integration tests/faults tests/e2e tests/smoke tests/security --junitxml=test-results/layers.xml -q

      - name: Upload layer results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layer-results-${{ matrix.python-version }}
          path: test-results/layers.xml
          if-no-files-found: error
          retention-days: 7

      - name: Run test suite
        run: python -m pytest -q

  coverage:
    name: Coverage enforcement
    runs-on: ubuntu-latest
    env:
      OPSWARM_CONFIG: config/test.yaml
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and quality tooling
        run: python -m pip install -e '.[dev]'

      - name: Run test suite with coverage
        run: >-
          python -m pytest
          --cov=opsswarm
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=89

      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  skill-gates:
    name: Skill gate ${{ matrix.skill }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: s1-intent-guard
            test_dir: tests/unit/skill_s1
          - skill: s2-task-graph
            test_dir: tests/unit/skill_s2
          - skill: s3-horizon-plan
            test_dir: tests/unit/skill_s3
          - skill: s4-role-dispatch
            test_dir: tests/unit/skill_s4
          - skill: s5-collab-exec
            test_dir: tests/unit/skill_s5
          - skill: s6-resilience-guard
            test_dir: tests/unit/skill_s6
          - skill: s7-observe-verify
            test_dir: tests/unit/skill_s7
          - skill: s8-orchestration-hub
            test_dir: tests/unit/skill_s8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run skill validation for ${{ matrix.skill }}
        id: validate
        run: |
          set -euo pipefail
          mkdir -p artifacts runtime-data/evidence
          python scripts/validate_skill.py \
            --skill "${{ matrix.skill }}" \
            --runnable \
            --evidence
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload skill-validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-validation-${{ matrix.skill }}
          path: |
            runtime-data/evidence/*.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail job on validation error
        if: steps.validate.outputs.exit_code != '0'
        run: |
          echo "Skill gate failed for ${{ matrix.skill }}" >&2
          exit 1

  docs-linkcheck:
    name: Documentation linkcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and test tooling
        run: python -m pip install -e '.[dev]'

      - name: Run documentation validation
        run: python docs/validate.py

  build:
    name: Build distributions
    needs: [coverage, skill-gates, docs-linkcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install build tooling
        run: python -m pip install 'build>=1.2,<2'

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
