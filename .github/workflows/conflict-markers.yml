name: Conflict markers

# Fails any change that carries unresolved merge-conflict markers (#133).
# No path filter: a marker in any file breaks main.
on:
  push:
    branches: [main]
  pull_request:

# ADR 0026 — least-privilege default. This workflow only reads source.
permissions:
  contents: read

concurrency:
  group: conflict-markers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: No conflict markers
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject merge-conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)'; then
            echo "::error::Unresolved merge-conflict markers found (see lines above)."
            exit 1
          fi
          echo "No merge-conflict markers."
