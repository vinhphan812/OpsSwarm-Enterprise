name: Manifest Validation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validation:
    name: Rendered Kubernetes schema and policy validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validator dependencies
        run: python -m pip install -e .

      - name: Render canonical Kubernetes overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/manifests
          kubectl kustomize k8s/base > artifacts/manifests/base.yaml
          kubectl kustomize k8s/overlays/dev > artifacts/manifests/dev.yaml
          kubectl kustomize k8s/overlays/prod > artifacts/manifests/prod.yaml

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/kubeconform.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory /usr/local/bin kubeconform

      - name: Validate rendered Kubernetes schemas without a cluster
        shell: bash
        run: |
          set -euo pipefail
          kubeconform -strict -summary artifacts/manifests/base.yaml
          kubeconform -strict -summary artifacts/manifests/dev.yaml
          kubeconform -strict -summary artifacts/manifests/prod.yaml

      - name: Enforce rendered manifest policy
        shell: bash
        run: |
          set -euo pipefail
          # The base profile is exercised here as well: it is the profile the
          # shipped base manifest must satisfy, and it used to be a dead path
          # that could drift from k8s/base/deployment.yaml without CI noticing.
          python scripts/validate_manifests.py --profile base artifacts/manifests/base.yaml
          python scripts/validate_manifests.py --profile dev artifacts/manifests/dev.yaml
          python scripts/validate_manifests.py --profile prod artifacts/manifests/prod.yaml

      - name: Prove the readiness-probe gate is live
        shell: bash
        run: |
          set -euo pipefail
          # Negative test: strip the readiness probe from the rendered prod
          # overlay and prove that the prod profile now rejects it.  Without
          # this the gate could silently regress into a no-op.
          python - <<'PY' > artifacts/manifests/prod-no-readiness.yaml
          import sys

          import yaml

          docs = list(yaml.safe_load_all(open("artifacts/manifests/prod.yaml", encoding="utf-8")))
          removed = False
          for doc in docs:
              if not isinstance(doc, dict) or doc.get("kind") != "Deployment":
                  continue
              for container in doc["spec"]["template"]["spec"].get("containers", []):
                  if container.pop("readinessProbe", None) is not None:
                      removed = True
          if not removed:
              sys.exit("ERROR: no readinessProbe block found in the rendered prod overlay")
          yaml.safe_dump_all(docs, sys.stdout, default_flow_style=False)
          PY
          if python scripts/validate_manifests.py --profile prod \
            artifacts/manifests/prod-no-readiness.yaml; then
            echo "ERROR: the prod profile accepted a manifest without a readinessProbe" >&2
            exit 1
          fi
          echo "OK: the prod profile rejects a manifest without a readinessProbe"

      - name: Upload rendered-manifest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-kubernetes-manifests
          path: artifacts/manifests/
          if-no-files-found: error
          retention-days: 30

# Image supply-chain evidence is deliberately produced only by release.yml.
# That workflow builds and pushes the immutable OCI image, verifies its registry
# manifest digest by pull, generates an image SBOM, runs a fail-closed Trivy
# scan, and publishes GitHub provenance. Duplicating release steps on every PR
# would create unauthenticated local-image evidence, not registry evidence.
