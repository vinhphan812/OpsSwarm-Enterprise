name: Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable v* tag to draft"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and draft release
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
    steps:
      - name: Resolve and validate release tag
        id: release_ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${PUSH_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" == v* ]] || { echo "Release ref must match v*." >&2; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tag is not a supported version tag: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the immutable tag ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release_ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checkout and package version agree with tag
        id: checked_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          }
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag/package version mismatch: tag={tag!r}, project={version!r}")
          print(f"Validated {tag} against project version {version}")
          PY

      - name: Set up Python 3.11 build environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked runtime and release tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -e '.[release]'

      - name: Fail fast if branch protection is absent on tag push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Detect the default branch name from the repository.
          default_branch=$(gh api repos/"$REPOSITORY" --jq '.default_branch')
          echo "Default branch: $default_branch"
          # Check for either a legacy branch-protection setting or a ruleset
          # targeting the default branch. Both must exist for a tag-push release
          # to be safe: the release.yml prerequisite check only runs on
          # workflow_dispatch, so a tag push proceeds without any CI gate if
          # neither protection layer is present.
          if gh api repos/"$REPOSITORY"/branches/"$default_branch"/protection \
               --jq '.url // empty' &>/dev/null; then
            echo "Branch protection found on $default_branch."
          elif gh api repos/"$REPOSITORY"/rulesets --jq \
               --arg branch "$default_branch" \
               --arg "refs/heads/$default_branch" \
               "[.[] | select(.rules | any(.type == \"required_status_checks\")) | select(.conditions.ref_name.target_branches | if type == \"array\" then \$branch | IN(.) or \$[\"refs/heads/\" + \$branch] | IN(.) else . == \$branch or . == \$[\"refs/heads/\" + \$branch] end)] | length" | {
               count=$(cat)
               if [[ "$count" -gt 0 ]]; then
                 echo "Repository ruleset with status checks found targeting $default_branch."
               else
                 echo >&2
                 echo >&2 "ERROR: No branch protection and no repository ruleset found on $default_branch."
                 echo >&2 "A tag push release CANNOT proceed safely without enforcement."
                 echo >&2
                 echo >&2 "Required setup (one of the following):"
                 echo >&2
                 echo >&2 "Option A — Branch protection (legacy):"
                 echo >&2 "  Settings > Branches > Protect $default_branch"
                 echo >&2 "  Require: CI, Security CI"
                 echo >&2 "  Require: branches up to date before merge"
                 echo >&2 "  Bypass: only admins"
                 echo >&2
                 echo >&2 "Option B — Repository ruleset (preferred):"
                 echo >&2 "  Settings > Rules > Rulesets > New ruleset targeting $default_branch"
                 echo >&2 "  Rule: Require status checks to pass before merging"
                 echo >&2 "  Required checks: CI, Security CI"
                 echo >&2
                 exit 1
               fi
             }

      - name: Require prerequisite CI and security checks
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.checked_tag.outputs.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          sha = os.environ["COMMIT_SHA"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          required = {"CI", "Security CI"}
          deadline = time.monotonic() + 900

          while True:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/actions/runs?head_sha={sha}&per_page=100",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]

              latest = {}
              for run in runs:
                  if run["id"] == current_run or run["name"] not in required:
                      continue
                  if run["event"] not in {"push", "pull_request", "workflow_dispatch", "schedule"}:
                      continue
                  prior = latest.get(run["name"])
                  if prior is None or run["run_number"] > prior["run_number"]:
                      latest[run["name"]] = run

              missing = sorted(required - latest.keys())
              pending = sorted(name for name, run in latest.items() if run["status"] != "completed")
              failed = sorted(
                  f"{name}={run['conclusion']}"
                  for name, run in latest.items()
                  if run["status"] == "completed" and run["conclusion"] != "success"
              )
              if failed:
                  raise SystemExit("Prerequisite checks failed closed: " + ", ".join(failed))
              if not missing and not pending:
                  print("Prerequisite quality and security workflows succeeded for", sha)
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      "Timed out waiting for prerequisite checks; missing="
                      + repr(missing)
                      + ", pending="
                      + repr(pending)
                  )
              print("Waiting for prerequisite workflows; missing=", missing, "pending=", pending)
              time.sleep(30)
          PY

      - name: Verify Python 3.11-3.13 metadata compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tomllib

          requires_python = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["requires-python"]
          if requires_python != ">=3.11":
              raise SystemExit(f"release policy expects requires-python >=3.11, got {requires_python!r}")
          print("Package metadata supports the CI-owned Python 3.11-3.13 matrix.")
          PY

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist artifacts/release
          mkdir -p artifacts/release
          python -m build --sdist --wheel --outdir dist
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Upload wheel and smoke config for downstream smoke job
        id: upload_wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel-${{ steps.release_ref.outputs.tag }}
          path: |
            dist/*.whl
            config/test.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Generate portable checksums and CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib

          files = sorted(pathlib.Path("dist").iterdir(), key=lambda item: item.name)
          if not files:
              raise SystemExit("No distributions found for checksum generation")
          output = pathlib.Path("artifacts/release/SHA256SUMS.txt")
          output.write_text(
              "".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in files),
              encoding="utf-8",
          )
          PY
          cyclonedx-py requirements requirements.txt \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-format JSON \
            --output-reproducible \
            --output-file artifacts/release/sbom.cdx.json
          python -m json.tool artifacts/release/sbom.cdx.json >/dev/null

      - name: Stage exact public release evidence
        shell: bash
        run: |
          set -euo pipefail
          cp dist/*.whl dist/*.tar.gz artifacts/release/
          python - <<'PY'
          import pathlib

          expected_suffixes = {".whl", ".gz"}
          evidence = pathlib.Path("artifacts/release")
          files = {path.name for path in evidence.iterdir() if path.is_file()}
          if "SHA256SUMS.txt" not in files or "sbom.cdx.json" not in files:
              raise SystemExit(f"release evidence incomplete: {sorted(files)}")
          if sum(name.endswith(".whl") for name in files) != 1:
              raise SystemExit(f"expected exactly one wheel: {sorted(files)}")
          if sum(name.endswith(".tar.gz") for name in files) != 1:
              raise SystemExit(f"expected exactly one sdist: {sorted(files)}")
          if len(files) != 4:
              raise SystemExit(f"unexpected release files: {sorted(files)}")
          PY

      - name: Require shared artifact-redaction validation
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/validate-artifacts.py || {
            echo "scripts/validate-artifacts.py is required from the issue #7 security implementation." >&2
            exit 1
          }
          python scripts/validate-artifacts.py \
            artifacts/release/SHA256SUMS.txt \
            artifacts/release/sbom.cdx.json

      - name: Attest release artifacts with GitHub OIDC
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/release/*.whl
            artifacts/release/*.tar.gz
            artifacts/release/SHA256SUMS.txt
            artifacts/release/sbom.cdx.json

      - name: Record provenance reference
        shell: bash
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_URL"
          {
            echo "# Release evidence for $RELEASE_TAG"
            echo
            echo "GitHub build provenance: $ATTESTATION_URL"
            echo "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Verify after download: gh attestation verify <artifact> --repo ${GITHUB_REPOSITORY}"
          } > artifacts/release/PROVENANCE.md

      - name: Validate public text evidence after provenance record
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-artifacts.py \
            artifacts/release/SHA256SUMS.txt \
            artifacts/release/sbom.cdx.json \
            artifacts/release/PROVENANCE.md

      - name: Upload 30-day release evidence
        id: upload_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ steps.release_ref.outputs.tag }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.release_ref.outputs.tag }}
          target_commitish: ${{ steps.checked_tag.outputs.sha }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            This release is a draft and requires explicit human approval before publication.

            Build provenance: ${{ steps.attest.outputs.attestation-url }}
            Retained workflow evidence: ${{ steps.upload_evidence.outputs.artifact-url }}
          files: |
            artifacts/release/*.whl
            artifacts/release/*.tar.gz
            artifacts/release/SHA256SUMS.txt
            artifacts/release/sbom.cdx.json

  smoke:
    name: Smoke test wheel in isolated venv
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download wheel and smoke config
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel-${{ needs.release.outputs.tag }}
          path: smoke-input/

      - name: Locate downloaded artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find smoke-input/ -maxdepth 1 -name '*.whl' -type f)
          config=$(find smoke-input/ -maxdepth 1 -name '*.yaml' -type f)
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          test -n "$wheel"
          test -n "$config"

      - name: Set up Python 3.11 managed environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Call smoke-wheel.py via the managed Python
        shell: bash
        env:
          WHEEL_PATH: ${{ steps.artifacts.outputs.wheel }}
          CONFIG_PATH: ${{ steps.artifacts.outputs.config }}
        run: |
          set -euo pipefail
          python scripts/smoke-wheel.py \
            --port 8765 \
            "$WHEEL_PATH" \
            "$CONFIG_PATH"
