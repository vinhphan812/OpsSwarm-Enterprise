name: Required Checks Bridge

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  checks: read

jobs:
  ci-required:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for bridge script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Wait for canonical CI checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/poll_check_runs.py \
            --repo "$REPO" \
            --head-sha "$HEAD_SHA" \
            --max-attempts 60 \
            --sleep 10 \
            --checks \
            "Verify dependency lock" \
            "Python 3.11 quality gates" \
            "Python 3.12 quality gates" \
            "Python 3.13 quality gates" \
            "Coverage enforcement" \
            "Build distributions"

  security-required:
    name: Security CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for bridge script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Wait for canonical Security CI check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/poll_check_runs.py \
            --repo "$REPO" \
            --head-sha "$HEAD_SHA" \
            --max-attempts 90 \
            --sleep 10 \
            --checks \
            "PR security checks"

  skill-gates-required:
    name: Skill Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for bridge script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Wait for canonical Skill Gates checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/poll_check_runs.py \
            --repo "$REPO" \
            --head-sha "$HEAD_SHA" \
            --max-attempts 60 \
            --sleep 10 \
            --checks \
            "Skill gate s1-intent-guard" \
            "Skill gate s2-task-graph" \
            "Skill gate s3-horizon-plan" \
            "Skill gate s4-role-dispatch" \
            "Skill gate s5-collab-exec" \
            "Skill gate s6-resilience-guard" \
            "Skill gate s7-observe-verify" \
            "Skill gate s8-orchestration-hub"
