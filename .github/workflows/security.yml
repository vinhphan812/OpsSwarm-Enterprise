name: Security CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 4 * * 1"  # 04:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # ── pr-checks ───────────────────────────────────────────────────────────────
  # Runs on pull_request events only.
  # Uploads four named artifacts (30-day retention) after validate-artifacts.py gate.
  pr-checks:
    name: PR security checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Install exact locked runtime graph
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --clear .locked-runtime
          .locked-runtime/bin/python -m pip install --require-hashes -r requirements.lock
          .locked-runtime/bin/python -m pip check
          rm -rf .locked-runtime/lib/python3.11/site-packages/pip* \
            .locked-runtime/lib/python3.11/site-packages/setuptools*

      # ── Bandit (1.9.4) ─────────────────────────────────────────────────────
      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Run Bandit security analysis
        run: python -m bandit -r . -f json -o artifacts/bandit.json --exit-zero

      # ── pip-audit (2.10.1) ────────────────────────────────────────────────
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Run pip-audit vulnerability scan against locked runtime
        run: python -m pip_audit --path .locked-runtime/lib/python3.11/site-packages --format=cyclonedx-json --output artifacts/pip-audit.json

      # ── Gitleaks (gitleaks-action v3) ──────────────────────────────────────
      # Gate-only: exit code determines pass/fail; no report uploaded.
      # GITHUB_TOKEN required by gitleaks-action v3 for PR scans.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── License scan (pip-licenses 5.5.5) ───────────────────────────────────
      - name: Install pip-licenses
        run: python -m pip install pip-licenses==5.5.5

      - name: Run license scan against locked runtime
        run: python -m piplicenses --python=.locked-runtime/bin/python --format=json --output-file=artifacts/licenses.json --path .locked-runtime/lib/python3.11/site-packages

      # ── SBOM (cyclonedx-bom 7.4.0) ─────────────────────────────────────────
      - name: Install CycloneDX
        run: python -m pip install cyclonedx-bom==7.4.0

      - name: Generate SBOM from locked runtime
        run: >-
          cyclonedx-py environment .locked-runtime/bin/python
          --pyproject pyproject.toml
          --mc-type application
          --output-format JSON
          --output-reproducible
          --output-file artifacts/sbom.cdx.json

      # ── Pre-upload validation (ADR-010-3) ─────────────────────────────────
      - name: Validate artifacts before upload
        run: python scripts/validate-artifacts.py artifacts/bandit.json artifacts/pip-audit.json artifacts/licenses.json artifacts/sbom.cdx.json

      # ── Upload artifacts (30-day retention) ─────────────────────────────────
      - name: Upload Bandit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-results
          path: artifacts/bandit.json
          retention-days: 30

      - name: Upload pip-audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-results
          path: artifacts/pip-audit.json
          retention-days: 30

      - name: Upload license scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-scan-results
          path: artifacts/licenses.json
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-results
          path: artifacts/sbom.cdx.json
          retention-days: 30

  # ── push-checks ────────────────────────────────────────────────────────────
  # Runs on push to master only, after pr-checks have passed.
  # CodeQL analysis (security-extended queries).
  push-checks:
    name: Push security checks
    runs-on: ubuntu-latest
    needs: pr-checks
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # ── full-suite ─────────────────────────────────────────────────────────────
  # Runs on schedule and workflow_dispatch: all pr-checks + CodeQL in one job.
  full-suite:
    name: Full security suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Install exact locked runtime graph
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --clear .locked-runtime
          .locked-runtime/bin/python -m pip install --require-hashes -r requirements.lock
          .locked-runtime/bin/python -m pip check
          rm -rf .locked-runtime/lib/python3.11/site-packages/pip* \
            .locked-runtime/lib/python3.11/site-packages/setuptools*

      # ── Bandit (1.9.4) ─────────────────────────────────────────────────────
      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Run Bandit security analysis
        run: python -m bandit -r . -f json -o artifacts/bandit.json --exit-zero

      # ── pip-audit (2.10.1) ────────────────────────────────────────────────
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Run pip-audit vulnerability scan against locked runtime
        run: python -m pip_audit --path .locked-runtime/lib/python3.11/site-packages --format=cyclonedx-json --output artifacts/pip-audit.json

      # ── Gitleaks (gitleaks-action v3) ──────────────────────────────────────
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── License scan (pip-licenses 5.5.5) ───────────────────────────────────
      - name: Install pip-licenses
        run: python -m pip install pip-licenses==5.5.5

      - name: Run license scan against locked runtime
        run: python -m piplicenses --python=.locked-runtime/bin/python --format=json --output-file=artifacts/licenses.json --path .locked-runtime/lib/python3.11/site-packages

      # ── SBOM (cyclonedx-bom 7.4.0) ─────────────────────────────────────────
      - name: Install CycloneDX
        run: python -m pip install cyclonedx-bom==7.4.0

      - name: Generate SBOM from locked runtime
        run: >-
          cyclonedx-py environment .locked-runtime/bin/python
          --pyproject pyproject.toml
          --mc-type application
          --output-format JSON
          --output-reproducible
          --output-file artifacts/sbom.cdx.json

      # ── Pre-upload validation (ADR-010-3) ─────────────────────────────────
      - name: Validate artifacts before upload
        run: python scripts/validate-artifacts.py artifacts/bandit.json artifacts/pip-audit.json artifacts/licenses.json artifacts/sbom.cdx.json

      # ── CodeQL (codeql-action v4) ──────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

      # ── Upload artifacts (30-day retention) ─────────────────────────────────
      - name: Upload Bandit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-results
          path: artifacts/bandit.json
          retention-days: 30

      - name: Upload pip-audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-results
          path: artifacts/pip-audit.json
          retention-days: 30

      - name: Upload license scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-scan-results
          path: artifacts/licenses.json
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-results
          path: artifacts/sbom.cdx.json
          retention-days: 30
