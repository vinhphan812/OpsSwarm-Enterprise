name: Skill Gates

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  skill-gates:
    name: Skill gate ${{ matrix.skill }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - s1-intent-guard
          - s2-task-graph
          - s3-horizon-plan
          - s4-role-dispatch
          - s5-collab-exec
          - s6-resilience-guard
          - s7-observe-verify
          - s8-orchestration-hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run skill validation for ${{ matrix.skill }}
        id: validate
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/validate_skill.py \
            --skill "${{ matrix.skill }}" \
            --evidence \
            --runnable
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload skill-validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-validation-${{ matrix.skill }}
          path: |
            runtime-data/evidence/*.jsonl
            runtime-data/evidence/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail job on validation error
        if: steps.validate.outputs.exit_code != '0'
        run: |
          echo "Skill gate failed for ${{ matrix.skill }}" >&2
          exit 1
