name: Web CI / CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/web.yml'

# Least-privilege permissions at workflow level.
# id-token: write is required for google-github-actions/auth to exchange
# a GitHub OIDC token for short-lived GCP credentials (WIF/OIDC).
permissions:
  contents: read
  id-token: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: ${{ vars.FIREBASE_API_BASE_URL }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is not set. Add FIREBASE_API_BASE_URL to repo Variables."
            exit 1
          fi
          if echo "$VITE_API_BASE_URL" | grep -q "localhost\|127.0.0.1"; then
            echo "ERROR: VITE_API_BASE_URL must not point to localhost"
            exit 1
          fi
          echo "Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"

      - name: TypeScript & build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 14

      - name: Coverage summary
        run: |
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat apps/web/coverage/coverage-summary.json 2>/dev/null || cat apps/web/coverage/text-summary.txt 2>/dev/null || echo "(run npm run test:coverage locally for details)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF/OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions@retailtwin-ai-511002.iam.gserviceaccount.com

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Deploy to Firebase Hosting
        # Uses ADC from WIF auth step above — no FIREBASE_TOKEN secret required.
        # google-github-actions/auth sets up Application Default Credentials that
        # Firebase CLI 15+ picks up automatically.
        run: npx firebase-tools@20.0.0 deploy --only hosting --project retailtwin-ai-511002 --non-interactive
