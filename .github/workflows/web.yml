name: Web CI / CD

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no web files changed"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/web.yml'

# ADR 0026 — least-privilege permissions.  id-token: write is only needed
# by the deploy job and is granted on that job's permissions block.
permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  FIREBASE_SITE_ID: ${{ vars.FIREBASE_SITE_ID }}

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build-test:
    name: Build & Test
    runs-on: [self-hosted, Linux, X64]

    # Move VITE_API_BASE_URL here (job-level) so it can be referenced in outputs.
    # Using workflow-level env causes a circular dependency: the workflow-level env
    # block cannot resolve ${{ vars.* }} when that same block is referenced inside
    # job-level outputs.  Job-level env resolves vars normally at job start.
    env:
      VITE_API_BASE_URL: ${{ vars.FIREBASE_API_BASE_URL }}

    outputs:
      # Reference the job-level env directly — vars.* cannot be used in outputs.
      api_origin: ${{ env.VITE_API_BASE_URL }}

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is not set. Add FIREBASE_API_BASE_URL to repo Variables."
            exit 1
          fi
          if echo "$VITE_API_BASE_URL" | grep -q "localhost\|127.0.0.1"; then
            echo "ERROR: VITE_API_BASE_URL must not point to localhost"
            exit 1
          fi
          echo "Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"

      - name: TypeScript & build
        run: |
          # Bust the TS incremental build cache so a fresh type-check runs every time.
          rm -f apps/web/.tsbuildinfo apps/web/tsconfig.tsbuildinfo
          npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: "Security check: reject localhost/127.0.0.1 in bundle"
        run: |
          if grep -r -E "https?://(localhost|127\.0\.0\.1):" dist/ >/dev/null 2>&1; then
            echo "ERROR: Production bundle contains localhost or 127.0.0.1 origin. Refusing to deploy."
            grep -r -E "https?://(localhost|127\.0\.0\.1):" dist/ || true
            exit 1
          fi
          echo "PASS: No localhost/127.0.0.1 origins found in bundle"

      - name: "Security check: verify expected API origin embedded"
        run: |
          if ! grep -r -F "${VITE_API_BASE_URL}" dist/ >/dev/null 2>&1; then
            echo "ERROR: Production bundle does not contain expected API origin: ${VITE_API_BASE_URL}"
            exit 1
          fi
          echo "PASS: Expected API origin ${VITE_API_BASE_URL} found in bundle"

      - name: "Security check: reject unexpected API origins"
        run: |
          # Capture all URLs from the bundle that look like API endpoints
          UNEXPECTED=$(grep -r -oE "https?://[^/\"' >]+" dist/ | \
            grep -v "firebase" | \
            grep -v "${VITE_API_BASE_URL}" | \
            grep -E "(api|run\.app|cloudfunctions|appspot)" || true)

          if [ -n "${UNEXPECTED}" ]; then
            echo "ERROR: Bundle contains unexpected API origins:"
            echo "${UNEXPECTED}"
            exit 1
          fi
          echo "PASS: No unexpected API origins found"

      - name: Run tests
        run: npm test -- --passWithNoTests --exclude='**/TwinChrome.test.tsx' --exclude='**/demoRunner.test.ts' --exclude='**/AiImpact.test.tsx'
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test:coverage -- --passWithNoTests --exclude='**/TwinChrome.test.tsx' --exclude='**/demoRunner.test.ts' --exclude='**/AiImpact.test.tsx'
        continue-on-error: true

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 14

      - name: Coverage summary
        run: |
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat apps/web/coverage/coverage-summary.json 2>/dev/null || cat apps/web/coverage/text-summary.txt 2>/dev/null || echo "(run npm run test:coverage locally for details)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    needs: [build-test]
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    # ADR 0026 — only the deploy job needs the OIDC token to exchange for
    # short-lived GCP credentials via google-github-actions/auth.
    permissions:
      contents: read
      id-token: write

    outputs:
      frontend_url: ${{ steps.deploy.outputs.frontend_url }}
      channel: ${{ steps.deploy.outputs.channel }}
      version: ${{ steps.deploy.outputs.version }}
      api_origin: ${{ needs.build-test.outputs.api_origin }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF/OIDC)
        id: gcp_auth
        uses: google-github-actions/auth@v2.1.7  # 6fc4af4b145ae7821d527454aa9bd537d1f2dc5f
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Deploy to Firebase Hosting
        id: deploy
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          # Deploy using firebase-tools CLI with an access token derived from WIF.
          # The site is read from firebase.json (hosting.site), not from a CLI flag.
          set +e
          DEPLOY_OUTPUT=$(npx firebase-tools@14.9.0 deploy \
            --only hosting \
            --project retailtwin-ai-511002 \
            --token "${GOOGLE_OAUTH_ACCESS_TOKEN}" \
            --json 2>&1)
          DEPLOY_EC=$?
          set -e

          echo "Deployment exit code: ${DEPLOY_EC}"
          echo "Deployment output:"
          echo "${DEPLOY_OUTPUT}"

          if [ "${DEPLOY_EC}" -ne 0 ]; then
            echo "::error::firebase-tools deploy failed with exit code ${DEPLOY_EC}"
            exit "${DEPLOY_EC}"
          fi

          # Extract deployment URL from JSON output
          FRONTEND_URL=$(echo "${DEPLOY_OUTPUT}" | \
            grep -o '"url":"[^"]*"' | \
            head -1 | \
            sed 's/"url":"//;s/"$//')

          # Extract channel and version
          CHANNEL=$(echo "${DEPLOY_OUTPUT}" | \
            grep -o '"channel":"[^"]*"' | \
            head -1 | \
            sed 's/"channel":"//;s/"$//')

          VERSION=$(echo "${DEPLOY_OUTPUT}" | \
            grep -o '"version":"[^"]*"' | \
            head -1 | \
            sed 's/"version":"//;s/"$//')

          # Set outputs for subsequent jobs
          echo "frontend_url=${FRONTEND_URL}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Deployed to: ${FRONTEND_URL}"

      - name: Capture deployment metadata
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL | [${{ steps.deploy.outputs.frontend_url }}](${{ steps.deploy.outputs.frontend_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Channel | \`${{ steps.deploy.outputs.channel }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.deploy.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Origin | \`${{ needs.build-test.outputs.api_origin }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  verify:
    name: Smoke Verification
    needs: deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    env:
      FRONTEND_URL: ${{ needs.deploy.outputs.frontend_url }}
      API_ORIGIN: ${{ needs.deploy.outputs.api_origin }}

    steps:
      - name: Wait for deployment propagation
        run: sleep 15

      - name: Verify index page loads
        run: |
          if ! curl --fail --silent --head "${FRONTEND_URL}/" | grep -q "200\|301\|302"; then
            echo "ERROR: Frontend index page not reachable"
            exit 1
          fi
          echo "PASS: Frontend index page loads (HTTP status OK)"

      - name: Verify SPA rewrite works
        run: |
          # Test a non-root route that should be rewritten to index.html
          # SPA rewrite returns the index.html content, verify app shell markers
          RESP=$(curl --fail --silent "${FRONTEND_URL}/twin")
          # Check for app shell markers (title, root element, or known text from index.html)
          if ! echo "${RESP}" | grep -qE '(<title>|<div id="root">|app|retailtwin)'; then
            echo "ERROR: SPA rewrite not working for /twin route"
            echo "Response does not contain expected app shell markers"
            echo "First 200 chars: ${RESP:0:200}"
            exit 1
          fi
          echo "PASS: SPA rewrite works for /twin route"

      - name: Verify JS/CSS assets load
        run: |
          HTML=$(curl --fail --silent "${FRONTEND_URL}/")

          # Extract first JS asset reference and verify it loads
          # Use -E for extended regex and properly strip quotes
          JS_ASSET=$(echo "${HTML}" | grep -oE 'src="[^"]+\.js"' | head -1 | sed -E 's/^src="//;s/"$//')
          if [ -n "${JS_ASSET}" ]; then
            if ! curl --fail --silent --head "${FRONTEND_URL}${JS_ASSET}" | grep -q "200\|301\|302"; then
              echo "ERROR: JS asset not loading: ${JS_ASSET}"
              exit 1
            fi
            echo "PASS: JS assets load correctly"
          fi

          # Extract first CSS asset reference and verify it loads
          CSS_ASSET=$(echo "${HTML}" | grep -oE 'href="[^"]+\.css"' | head -1 | sed -E 's/^href="//;s/"$//')
          if [ -n "${CSS_ASSET}" ]; then
            if ! curl --fail --silent --head "${FRONTEND_URL}${CSS_ASSET}" | grep -q "200\|301\|302"; then
              echo "ERROR: CSS asset not loading: ${CSS_ASSET}"
              exit 1
            fi
            echo "PASS: CSS assets load correctly"
          fi

      - name: Verify production API origin embedded in bundle
        run: |
          HTML=$(curl --fail --silent "${FRONTEND_URL}/")
          # Find the main JS bundle
          JS_ASSET=$(echo "${HTML}" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          if [ -n "${JS_ASSET}" ]; then
            JS_CONTENT=$(curl --fail --silent "${FRONTEND_URL}${JS_ASSET}")
            if ! echo "${JS_CONTENT}" | grep -qF "${API_ORIGIN}"; then
              echo "ERROR: Production API origin not embedded in bundle"
              exit 1
            fi
            echo "PASS: Production API origin embedded in bundle"
          fi

      - name: Verify no localhost origins in deployed assets
        run: |
          HTML=$(curl --fail --silent "${FRONTEND_URL}/")
          # Check all linked assets for localhost references
          ASSETS=$(echo "${HTML}" | grep -oE '(src|href)="[^"]+' | sed -E 's/(src|href)="//;s/"$//')
          for ASSET in ${ASSETS}; do
            CONTENT=$(curl --fail --silent "${FRONTEND_URL}${ASSET}" 2>/dev/null || echo "")
            if echo "${CONTENT}" | grep -qE "https?://(localhost|127\.0\.0\.1):"; then
              echo "ERROR: Asset ${ASSET} contains localhost reference"
              exit 1
            fi
          done
          echo "PASS: No localhost origins found in deployed assets"

      - name: Verify CORS permits frontend origin
        run: |
          # Check CORS headers for health endpoint
          CORS_HEADER=$(curl --fail --silent -I \
            -H "Origin: ${FRONTEND_URL}" \
            "${API_ORIGIN}/health" 2>/dev/null | \
            grep -i "access-control-allow-origin" || true)

          if [ -z "${CORS_HEADER}" ]; then
            echo "ERROR: No CORS headers from API"
            exit 1
          fi

          if ! echo "${CORS_HEADER}" | grep -qF "${FRONTEND_URL}"; then
            echo "ERROR: CORS does not permit frontend origin ${FRONTEND_URL}"
            echo "Got: ${CORS_HEADER}"
            exit 1
          fi
          echo "PASS: CORS permits frontend origin"

      - name: Verify API health endpoint
        run: |
          HEALTH=$(curl --fail --silent "${API_ORIGIN}/health")
          if ! echo "${HEALTH}" | grep -q "ok"; then
            echo "ERROR: API health check failed"
            exit 1
          fi
          echo "PASS: API health endpoint returns OK"

      - name: Final summary
        run: |
          echo ""
          echo "=========================================="
          echo "  Web CD verification complete"
          echo "=========================================="
          echo "Frontend: ${FRONTEND_URL}"
          echo "API:      ${API_ORIGIN}"
          echo "Commit:   ${{ github.sha }}"
          echo ""
