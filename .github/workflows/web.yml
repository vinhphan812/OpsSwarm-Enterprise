name: Web CI / CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/web.yml'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: https://retailtwin-api-5rgtvr4gpa-uc.a.run.app

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 14

      - name: Coverage summary
        run: |
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat apps/web/coverage/coverage-summary.json 2>/dev/null || cat apps/web/coverage/text-summary.txt 2>/dev/null || echo "(run npm run test:coverage locally for details)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: retailtwin-ai-511002
