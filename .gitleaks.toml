# Allowlist for test fixture placeholders that trigger false-positive
# gitleaks generic-api-key detections.
# The value "***" in test data carries zero entropy and is not a secret.
[rules.allowlist]
  description = "Placeholder token values in test fixtures"
  paths = ['''tests/unit/test_coverage_gaps\.py''']
  regexes = ['''"token":\s*"\*\*\*"''']
