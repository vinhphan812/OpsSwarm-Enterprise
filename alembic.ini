# Alembic configuration for the OpsSwarm HA coordination schema (ADR-031).
#
# The database URL is never stored in this file.  It is read from the
# HA_DATABASE_URL environment variable by migrations/env.py, so the same
# migration scripts can be applied to any environment without editing a
# tracked file:
#
#   export HA_DATABASE_URL="postgresql://user:secret@host:5432/opsswarm_ha"
#   alembic upgrade head
#   alembic downgrade -1
#
# Run these commands from the repository root.

[alembic]
# Path to the migration scripts (migrations/env.py, migrations/versions/).
script_location = migrations

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Path separator used for sys.path and version_locations entries.
path_separator = os

# timezone to use when rendering the date within the migration file
# as well as the filename.
# timezone = UTC

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file.
# sourceless = false

# version location specification.
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version path separator.
version_path_separator = os

# the output encoding used when revision files are written from script.py.mako.
output_encoding = utf-8

# The database URL is supplied via the HA_DATABASE_URL environment variable.
# This placeholder exists so that the config is always parseable; migrations/env.py
# overrides it at runtime and raises a clear error when the variable is absent.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
