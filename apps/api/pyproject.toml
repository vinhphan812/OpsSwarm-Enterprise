[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retailtwin-api"
version = "0.1.0"
description = "RetailTwin application API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "google-auth>=2.0",
  "google-cloud-pubsub>=2.21",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-mypy-plugins",
  "google-auth-stubs>=0.3",
  "pytest-cov>=5.0",
]

[project.scripts]
retailtwin-api = "retailtwin_api.main:main"

[tool.setuptools.packages.find]
include = ["retailtwin_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["retailtwin_api"]
branch = true
omit = [
  "*/.venv/*",
  "*/__pycache__/*",
  "*/.pytest_cache/*",
  "*/retailtwin_api.egg-info/*",
  "*/__main__.py",
  "*/backbone_cli.py",
]

[tool.coverage.report]
# Machine-enforced non-regression floor.
# Current baseline: 89% line / 85% branch.
# Repository minimum: >= 85% line / >= 75% branch.
# CI fails when coverage drops below this value.
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
