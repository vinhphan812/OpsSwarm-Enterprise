repo: test/example
required_issue_label: opsswarm
create_corrective_issues: false
root_cause_confidence_threshold: 0.80
verification_confidence_threshold: 0.85
openclaw:
  main_agent: opsswarm-incident-manager
  timeout_seconds: 30
  profiles:
    incident-manager: opsswarm-incident-manager
    observability-investigator: opsswarm-observability-investigator
    application-investigator: opsswarm-application-investigator
    infrastructure-investigator: opsswarm-infrastructure-investigator
    database-investigator: opsswarm-database-investigator
    recovery-responder: opsswarm-recovery-responder
    communications-postmortem: opsswarm-communications-postmortem
policy:
  read: AUTO
  safe_write: AUTO
  risky_write: HUMAN_APPROVAL
  destructive: DENY
human_authority:
  minimum_permission_for_input: read
  minimum_permission_for_approval: maintain
  minimum_permission_for_abort: maintain
labels:
  base: [ opsswarm, incident ]
  lifecycle:
    TRIAGE: state:triage
    INVESTIGATING: state:investigating
    DIAGNOSED: state:diagnosed
    PLANNING: state:planning
    EXECUTING: state:executing
    VERIFYING: state:verifying
    WAITING_APPROVAL: state:waiting-approval
    WAITING_DECISION: state:waiting-decision
    WAITING_INPUT: state:waiting-input
    RESOLVED: state:resolved
    FAILED: state:failed
    ABORTED: state:aborted

persistence:
  enable_idempotency: true
  enable_state_enforcement: true  # strict in tests
  enable_checkpoints: true
  enable_atomic_writes: true
