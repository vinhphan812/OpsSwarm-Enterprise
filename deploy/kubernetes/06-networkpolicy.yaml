apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsswarm-default-isolation
  namespace: opsswarm-production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opsswarm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8088
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
