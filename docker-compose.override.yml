# docker-compose.override.yml — local development overrides
#
# This file is automatically applied when you run `docker compose up` in a
# development directory (Compose reads *.override.yml automatically).
#
# For production use, explicitly specify the compose file:
#   docker compose -f docker-compose.yml up -d
#
# ─── Local development overrides ────────────────────────────────────────────────
#
# Hot reload: bind-mount the source tree so file changes are picked up without
# rebuilding the image.  Only effective when the image was built with `pip install
# -e` (editable mode); the canonical Dockerfile installs a wheel, so in-place
# source changes require a rebuild:
#   docker compose build opsswarm && docker compose up -d
#
services:

  opsswarm:
    # Override resource limits for local dev (laptop-friendly).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    volumes:
      # Bind-mount config so local YAML changes take effect without a rebuild.
      # Production: use a named volume or image-baked config (see docker-compose.yml).
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          propagation: rprivate

      # Bind-mount scripts directory (skill scripts, helpers).
      - type: bind
        source: ./scripts
        target: /app/scripts
        read_only: true
        bind:
          propagation: rprivate

      # Bind-mount opsswarm source (requires image built with `pip install -e .`).
      # Uncomment for hot-reload development; comment out to use the baked wheel.
      # - type: bind
      #   source: ./opsswarm
      #   target: /app/opsswarm
      #   read_only: true
      #   bind:
      #     propagation: rprivate

      # Bind-mount apps/ and services/ (also needed for editable installs).
      # - type: bind
      #   source: ./apps
      #   target: /app/apps
      #   read_only: true
      #   bind:
      #     propagation: rprivate
      # - type: bind
      #   source: ./services
      #   target: /app/services
      #   read_only: true
      #   bind:
      #     propagation: rprivate

      # Override the read-only token file bind with a writable one for local dev.
      # In production (docker-compose.yml) this is read-only.
      # Remove the volume entry from docker-compose.yml when using this override.
      # - type: bind
      #   source: ./.github-token-dev
      #   target: /run/secrets/github-token
      #   read_only: true
      #   bind:
      #     propagation: rprivate

    # Keep container running for debugging.
    # Replace `sleep infinity` with the normal entrypoint when done:
    # command: ["/app/.venv/bin/python", "-m", "uvicorn", "opsswarm.api:app", "--host", "0.0.0.0", "--port", "8080"]
    # command: ["sleep", "infinity"]

    # Mount a local requirements.lock to allow pip-audit / security scans.
    # Uncomment the line below if you have a local trivy binary:
    # additionalProperties:
    #   Profiles: [dev]
