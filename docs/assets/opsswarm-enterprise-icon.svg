<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpsSwarm Enterprise icon</title>
  <desc id="desc">A governed swarm of eight agent nodes surrounding a protected incident-response core.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Governance boundary -->
  <path d="M256 34 399 92 454 230c19 109-47 205-198 248C105 435 39 339 58 230L113 92Z"
        fill="url(#shield)" stroke="#38BDF8" stroke-width="12" stroke-linejoin="round"/>

  <!-- Swarm graph: eight governed capabilities -->
  <g fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <path d="M256 150 256 92"/>
    <path d="M322 176 364 134"/>
    <path d="M350 244 410 244"/>
    <path d="M322 312 364 354"/>
    <path d="M256 338 256 398"/>
    <path d="M190 312 148 354"/>
    <path d="M162 244 102 244"/>
    <path d="M190 176 148 134"/>
  </g>

  <g fill="#E2E8F0" stroke="#0F172A" stroke-width="8">
    <circle cx="256" cy="82" r="22"/>
    <circle cx="374" cy="126" r="22"/>
    <circle cx="420" cy="244" r="22"/>
    <circle cx="374" cy="362" r="22"/>
    <circle cx="256" cy="408" r="22"/>
    <circle cx="138" cy="362" r="22"/>
    <circle cx="92" cy="244" r="22"/>
    <circle cx="138" cy="126" r="22"/>
  </g>

  <!-- Incident-response core -->
  <circle cx="256" cy="244" r="110" fill="#0B1220" stroke="url(#core)" stroke-width="14"/>
  <circle cx="256" cy="244" r="78" fill="none" stroke="#1E293B" stroke-width="18"/>

  <!-- Observable pulse + bounded decision -->
  <path d="M183 251h39l17-42 32 78 19-45h39"
        fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="244" r="13" fill="#F59E0B" stroke="#0B1220" stroke-width="6"/>

  <!-- Recovery check -->
  <path d="m214 321 27 27 58-64"
        fill="none" stroke="#34D399" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
