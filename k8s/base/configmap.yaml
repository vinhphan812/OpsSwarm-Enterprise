# k8s/configmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
# OpsSwarm Enterprise — non-sensitive configuration
#
# Sensitive values (tokens, credentials) belong in the Secret, not here.
# All values may be overridden per-deployment via the overlays.
#
# Apply:  kubectl apply -f k8s/configmap.yaml
# Validate: kubectl apply --dry-run=server -f k8s/configmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: opsswarm-config
  namespace: opsswarm
  labels:
    app.kubernetes.io/name: opsswarm
    app.kubernetes.io/component: config
    app.kubernetes.io/version: "2.2.0"
data:
  # ── OpsSwarm runtime paths ────────────────────────────────────────────────
  # Config file path.  production.yaml lives under /app/config/ inside the
  # container and is copied from the image at build time.
  OPSWARM_CONFIG: /app/config/production.yaml

  # The ONE writable state root inside the container.
  #
  # RunStore writes ${OPSWARM_DATA_DIR}/runs/*.json and EvidenceStore writes
  # ${OPSWARM_DATA_DIR}/evidence/*.jsonl.  The deployment mounts a single
  # PersistentVolumeClaim at exactly this path, so all persistent state lives
  # on one durable, single-writer volume.
  #
  # ⚠️  Must match the mountPath of the opsswarm-state volume in deployment.yaml.
  OPSWARM_DATA_DIR: /var/lib/opsswarm

  # ── App environment ────────────────────────────────────────────────────────
  # development | production
  # Set to "production" in overlays/prod to enable fail-closed auth checks.
  APP_ENV: development

  # ── GitHub repository ──────────────────────────────────────────────────────
  # GitHub repository in owner/repo format.  config/production.yaml resolves
  # `repo: ${GITHUB_REPO}` at load time; the application fails closed at
  # import if it is not a valid owner/repo pair.
  GITHUB_REPO: vinhphan812/OpsSwarm-Enterprise

  # ── Logging ───────────────────────────────────────────────────────────────
  # CRITICAL | ERROR | WARNING | INFO | DEBUG
  # Default is INFO.  Use WARNING in production to reduce log volume.
  LOG_LEVEL: INFO

  # ── Evidence store ────────────────────────────────────────────────────────
  # Backend for EvidenceStore:
  #   file  — writes evidence to /var/lib/opsswarm/evidence/ (default)
  #   memory — in-process only; evidence is lost on restart (development only)
  EVIDENCE_STORE_BACKEND: file

  # ── HTTP server ───────────────────────────────────────────────────────────
  # Port uvicorn binds inside the container (matches Dockerfile EXPOSE 8080).
  PORT: "8080"

  # ── OpenClaw runtime ─────────────────────────────────────────────────────
  # Absolute path to the OpenClaw binary.  OpsSwarm reads this from the
  # environment at startup; it is NOT embedded in the image layers so that
  # OpenClaw can be upgraded independently of the OpsSwarm image.
  #
  # ⚠️  The base manifest does NOT include an init container or volume mount for
  # the binary.  Operators MUST ensure the binary is available at this path:
  #
  # Dev (overlays/dev): bind-mount from the host node filesystem.
  #   Ensure /usr/local/bin/openclaw exists on every node running the pod, or
  #   override this value to point to a hostPath volume.
  #
  # Prod options (pick one):
  #   1. Pre-install openclaw on each node and reference it via hostPath.
  #   2. Init container that fetches/extracts the binary from a trusted source.
  #   3. ReadOnlyMany PVC containing the binary, mounted at this path.
  #   4. Override this value in your production overlay to match your chosen
  #      delivery strategy.
  #
  # The deployment manifest mounts this path as a read-only volume at
  # /usr/local/bin/openclaw and sets OPSWARM_OPENCLAW_BIN to that path.
  OPSWARM_OPENCLAW_BIN: /usr/local/bin/openclaw

  # ── OpenClaw behaviour ───────────────────────────────────────────────────
  # Maximum wall-clock seconds for a single OpenClaw agent invocation.
  OPENCLAW_TIMEOUT_SECONDS: "600"

  # ── Container user ────────────────────────────────────────────────────────
  # Matches the uid of the appuser defined in the Dockerfile.
  # Used as fsGroup so non-root writes to emptyDir volumes are group-readable.
  APP_USER_UID: "10001"
