# k8s/base/network-policy.yaml
# ─────────────────────────────────────────────────────────────────────────────
# OpsSwarm Enterprise — Kubernetes NetworkPolicy (least-privilege)
#
# This manifest implements two policies:
#
#   1. Ingress policy: explicit allowlist only —
#       (a) same-namespace pods (egress-gateway sidecars, ingress controller
#           co-located in the opsswarm namespace)
#       (b) namespaces labelled allow-opsswarm-ingress=true
#           (dedicated ingress controller, monitoring systems)
#       (c) IN PRODUCTION OVERLAY ONLY: cluster-external load-balancer CIDRs
#           (managed in k8s/overlays/prod/ — never 0.0.0.0/0 in base)
#
#   2. Egress policy: all traffic denied by default (default-deny egress is
#      the default behaviour when no NetworkPolicy is present; operators who
#      want an explicit default-deny should apply a deny-all egress policy to
#      the namespace first).  Allowed destinations:
#       (a) Kubernetes DNS — kube-dns/CoreDNS, required for all service discovery
#       (b) GitHub API — api.github.com HTTPS (TCP 443)
#       (c) OpenClaw runtime — localhost or openclaw-system namespace (sidecar)
#       (d) Cloud metadata service — GCP/AWS workload identity
#       (e) IN PRODUCTION OVERLAY: explicit model-provider CIDRs (OpenAI,
#           Anthropic, Vertex AI) — documented, not 0.0.0.0/0
#
# Prerequisites:
#   - A NetworkPolicy-capable CNI plugin (Calico ≥3.27, Cilium, Weave, etc.).
#     On managed K8s (GKE autopilot, EKS with VPC CNI, AKS with Azure CNI),
#     enable the add-on that supports NetworkPolicy.
#   - Label allowed ingress namespaces:
#       kubectl label namespace <ingress-ns> allow-opsswarm-ingress=true
#   - For production: consult k8s/overlays/prod/network-policy.yaml for
#     load-balancer CIDR notes and cluster-policy integration.
#
# Verified egress destinations:
#   GitHub API:   api.github.com (TCP 443)  — GitHub's published AS16033 CIDR
#                 140.82.112.0/22          (verified 2024; re-check annually)
#                 https://api.github.com/meta
#   OpenClaw:     localhost:8081 (sidecar) OR openclaw-system namespace
#   DNS:          kube-dns/CoreDNS (UDP+TCP 53)
#   Metadata:     169.254.169.254/32       (GCP/AWS workload identity)
#
# GitHub Enterprise Server (self-hosted): replace the 140.82.112.0/22 block
# in overlays/prod with your GitHub Enterprise Server IP ranges.
#
# Apply:  kubectl apply -f k8s/base/network-policy.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsswarm-network-policy
  namespace: opsswarm
  labels:
    app.kubernetes.io/name: opsswarm
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/version: "2.2.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opsswarm

  # ── Ingress policy ────────────────────────────────────────────────────────
  # Explicit allowlist only.  No 0.0.0.0/0 rule in base.
  # In production, add load-balancer CIDRs via k8s/overlays/prod/.
  ingress:
    # Allow same-namespace traffic (egress-gateway sidecars, co-located ingress
    # controller, health probes from same namespace).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Allow from namespaces with allow-opsswarm-ingress=true label.
    # Typical uses:
    #   - Dedicated ingress controller namespace (e.g. ingress-nginx, istio-system)
    #   - Monitoring namespace (Prometheus scrape sidecars, OTel collectors)
    #   - Development tools namespace
    # Label your ingress controller namespace:
    #   kubectl label namespace <your-ingress-ns> allow-opsswarm-ingress=true
    - from:
        - namespaceSelector:
            matchLabels:
              allow-opsswarm-ingress: "true"
      ports:
        - protocol: TCP
          port: 8080

  # ── Egress policy ─────────────────────────────────────────────────────────
  # Allow outbound traffic only to explicitly listed destinations.
  # All other egress is denied (default-deny behavior).
  egress:
    # ── DNS ────────────────────────────────────────────────────────────────
    # Kubernetes internal DNS (CoreDNS / kube-dns).  Required for all service
    # discovery and internal cluster communication.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # ── GitHub API ─────────────────────────────────────────────────────────
    # OpsSwarm Enterprise reads and writes GitHub issues and pull requests.
    #
    # CIDR basis: GitHub publishes their IP ranges at https://api.github.com/meta
    # ("api" key).  Each published range is listed as its own ipBlock because
    # a NetworkPolicy ipBlock admits one CIDR plus an optional "except" list,
    # and every entry in "except" must be a strict subset of that one CIDR.
    # A single wide CIDR with unrelated exclusions is rejected by the API
    # server, so the ranges are enumerated individually.
    # Re-check annually — stale CIDRs will cause OpsSwarm to fail GitHub API calls.
    # GitHub Enterprise Server: replace this block with your self-hosted IP ranges
    # (managed in k8s/overlays/prod/network-policy.yaml).
    - to:
        - ipBlock:
            cidr: 140.82.112.0/20
        - ipBlock:
            cidr: 143.55.64.0/20
        - ipBlock:
            cidr: 185.199.108.0/22
        - ipBlock:
            cidr: 192.30.252.0/22
      ports:
        - protocol: TCP
          port: 443

    # ── OpenClaw runtime ───────────────────────────────────────────────────
    # OpsSwarm connects to the OpenClaw AI reasoning runtime.
    #
    # Supported deployment topologies:
    #   (a) Sidecar: OpenClaw in the same pod, accessed via localhost:8081.
    #               docker-compose: mount openclaw-data:/opt/openclaw and set
    #               OPSWARM_OPENCLAW_BIN=/opt/openclaw/openclaw in the opsswarm
    #               service environment.
    #   (b) Cluster service: OpenClaw in a dedicated openclaw-system namespace,
    #               accessed via the openclaw.openclaw-system.svc.cluster.local service.
    #               Configure OPSWARM_OPENCLAW_BIN to point to the service endpoint.
    #
    # The namespaceSelector below covers topology (b); the ipBlock 127.0.0.1/32
    # covers topology (a).  Adjust the podSelector labels to match your OpenClaw
    # installation labels.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw
      ports:
        - protocol: TCP
          port: 8081
    # Allow to localhost for sidecar pattern (OpenClaw running as co-located
    # sidecar in the same pod).  This is the default compose topology.
    - to:
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 8081

    # ── Cloud metadata service ──────────────────────────────────────────────
    # Required for workload identity (GCP SA keyless auth, AWS IRSA).
    # Without this, the pod cannot obtain short-lived credentials from the cloud.
    # Omit this block entirely if you are not using cloud workload identity.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    # GCP internal metadata API
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 988

    # ── HTTPS outbound for OpenClaw model providers ───────────────────────
    # If OpenClaw calls external LLM APIs (e.g. OpenAI, Anthropic, Vertex AI),
    # add their egress CIDRs here.  Consult the provider's IP ranges documentation.
    # As a minimum, allow 443 outbound to the public internet for model providers:
    # NOTE: Uncomment only if your OpenClaw runtime makes outbound model calls.
    # Commenting out by default to keep the policy tight.
    # - to:
    #     - ipBlock:
    #         cidr: 0.0.0.0/0
    #   ports:
    #     - protocol: TCP
    #       port: 443
