# k8s/secret.yaml
# ─────────────────────────────────────────────────────────────────────────────
# OpsSwarm Enterprise — Secret template
#
# ⚠️  DO NOT commit real credentials to source control.
#
# This file documents the required Secret keys and provides placeholder values
# that satisfy schema validation.  Replace all placeholder values with real
# values in a proper secrets-management workflow BEFORE applying to the cluster.
#
# ── Recommended secrets management ──────────────────────────────────────────
#
# Option A — kubectl (simplest, dev / single-node):
#   kubectl create secret generic opsswarm-secrets \
#     --namespace=opsswarm \
#     --from-literal=GITHUB_TOKEN='ghp_xxxxxxxxxxxxxxxxxxxx' \
#     --from-literal=OPSWARM_OPENCLAW_KEY='sk-xxxxxxxxxxxxxxxxxxxx'
#
# Option B — sealed-secrets (GitOps-safe, Bitnami SealedSecrets controller):
#   1. Install the SealedSecrets controller in the cluster.
#   2. Encode each value: echo -n 'ghp_xxx' | base64
#   3. Create a SealedSecret manifest using the controller CLI:
#        kubeseal --cert <pub-cert.pem> -f secret.yaml -w sealed-secret.yaml
#   4. Commit sealed-secret.yaml to git; the controller decrypts at runtime.
#
# Option C — external secrets operator (AWS SM / GCP SM / Vault):
#   Use the ExternalSecrets operator to sync from your cloud secret manager.
#   See docs/guides/CONTAINER_DEPLOYMENT.md for a Cloud Run / GKE example.
#
# ── Required keys ───────────────────────────────────────────────────────────
#
# GITHUB_TOKEN
#   Personal Access Token (PAT) or GitHub App installation token.
#   Minimum scopes: repo (full control), read:org (for team membership checks).
#   Token format: ghp_*, gho_*, ghu_*, ghs_*, or ghr_* (GitHub Enterprise
#   Server uses a bearer token format — check your GHE documentation).
#
# OPSWARM_OPENCLAW_KEY
#   API key or license token for the OpenClaw runtime.
#   Set OPSWARM_OPENCLAW_BIN in the ConfigMap to the path of the OpenClaw
#   binary on the host or in a Kubernetes volume before setting this key.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: opsswarm-secrets
  namespace: opsswarm
  labels:
    app.kubernetes.io/name: opsswarm
    app.kubernetes.io/component: secrets
    app.kubernetes.io/version: "2.2.0"
type: Opaque
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Replace every placeholder value below with a real credential
# before applying to a cluster.  The stringData fields below are base for
# documentation only and are NOT suitable for production use without replacing.
# ─────────────────────────────────────────────────────────────────────────────
stringData:
  # OPSWARM_RUNTIME_SECRET must be injected from a secret manager at deploy time.

  # REQUIRED — GitHub Personal Access Token or GitHub App installation token.
  # Replace 'REPLACE_WITH_REAL_GITHUB_TOKEN' with your actual token.
  GITHUB_TOKEN: REPLACE_WITH_REAL_GITHUB_TOKEN

  # REQUIRED — OpenClaw runtime API key / license token.
  # Replace 'REPLACE_WITH_REAL_OPENCLAW_KEY' with your actual key.
  OPSWARM_OPENCLAW_KEY: REPLACE_WITH_REAL_OPENCLAW_KEY
