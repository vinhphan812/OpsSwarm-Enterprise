# k8s/service.yaml
# ─────────────────────────────────────────────────────────────────────────────
# OpsSwarm Enterprise — Kubernetes Service
#
# Uses ClusterIP by default (internal cluster access only).
# In overlays/prod, change type to LoadBalancer or add an Ingress resource.
#
# Apply:  kubectl apply -f k8s/service.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: opsswarm
  namespace: opsswarm
  labels:
    app.kubernetes.io/name: opsswarm
    app.kubernetes.io/component: service
    app.kubernetes.io/version: "2.2.0"
  annotations:
    # prometheus.io/scrape: "true"  # enable if prometheus-operator is installed
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opsswarm
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
