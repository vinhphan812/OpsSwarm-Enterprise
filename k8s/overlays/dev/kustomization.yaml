# k8s/overlays/dev/kustomization.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Dev overlay — local development cluster (minikube, kind, k3s)
#
# Overrides from base:
#   - imagePullPolicy: Always (auto-reload on rebuild)
#   - APP_ENV: development
#   - LOG_LEVEL: DEBUG
#   - Service type: NodePort (for local access without load balancer)
#   - evidence/runtime-data: emptyDir for clusters without dynamic StorageClass.
#     For clusters with dynamic PVC provisioning, remove the volume patches below.
#   - secret: generated from local .env values via kustomize secretGenerator
#
# Usage:
#   # Generate secret from local .env values (requires yq):
#   kubectl create secret generic opsswarm-secrets \
#     --namespace=opsswarm \
#     --from-literal=GITHUB_TOKEN="$(yq -r '.GITHUB_TOKEN // empty' .env 2>/dev/null)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # Apply dev overlay:
#   kubectl apply -k k8s/overlays/dev
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opsswarm

resources:
  - ../../base

# ── Patches ─────────────────────────────────────────────────────────────────
patches:
  # Use Always pull policy for local development (rebuilds auto-reload).
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: opsswarm

  # Override APP_ENV and LOG_LEVEL from base ConfigMap.
  - patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
    target:
      kind: ConfigMap
      name: opsswarm-config

  # Change service type to NodePort for local access.
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
    target:
      kind: Service
      name: opsswarm

  # Use emptyDir for evidence and runtime-data in local dev (no cluster storage needed).
  # Remove these two patches if your cluster has dynamic StorageClass provisioning.
  # Volume index: 0=evidence-store, 1=runtime-data, 2=tmp.
  # evidence-store: emptyDir (local dev — durability not required)
  - patch: |-
      - op: remove
        path: /spec/template/spec/volumes/0/persistentVolumeClaim
      - op: add
        path: /spec/template/spec/volumes/0/emptyDir
        value: {}
    target:
      kind: Deployment
      name: opsswarm

  # runtime-data: emptyDir (local dev — durability not required)
  - patch: |-
      - op: remove
        path: /spec/template/spec/volumes/1/persistentVolumeClaim
      - op: add
        path: /spec/template/spec/volumes/1/emptyDir
        value: {}
    target:
      kind: Deployment
      name: opsswarm

# ── Secret generator ─────────────────────────────────────────────────────────
# WARNING: This generates a secret from literal values.  Do NOT store real
# tokens in this file or in any git-tracked location.
#
# For real deployments, use one of:
#   1. kubectl create secret (see docs/guides/CONTAINER_DEPLOYMENT.md)
#   2. sealed-secrets with kubeseal
#   3. external-secrets operator with your cloud secret manager
secretGenerator:
  - name: opsswarm-secrets
    literals:
      # ⚠️  Replace with your actual dev tokens.  Never commit real values.
      - OPSWARM_RUNTIME_SECRET=dev-only-placeholder-runtime-secret-change-before-use
      - GITHUB_TOKEN=REPLACE_WITH_DEV_GITHUB_TOKEN
      - OPSWARM_OPENCLAW_KEY=REPLACE_WITH_DEV_OPENCLAW_KEY
    type: Opaque

# ── Images ────────────────────────────────────────────────────────────────────
images:
  - name: ghcr.io/vinhphan812/opsswarm-enterprise
    newTag: dev
    newName: ghcr.io/vinhphan812/opsswarm-enterprise
