# k8s/overlays/prod/network-policy.yaml
# ─────────────────────────────────────────────────────────────────────────────
# OpsSwarm Enterprise — Production NetworkPolicy overlay
#
# This patch adds two rules to the base NetworkPolicy:
#   1. Ingress from a deliberately labelled production ingress namespace
#      (NOT a broad 0.0.0.0/0 allowance and NOT a cloud LB CIDR list — the
#      provider CIDRs are only known per environment and belong in a
#      separately reviewed overlay).
#   2. Egress to model-provider endpoints (OpenAI, Anthropic, Vertex AI),
#      documented as commented examples that the operator un-comments.
#
# Cluster-policy integration note:
#   If your cluster uses a ClusterNetworkPolicy (Cilium) or GlobalNetworkPolicy
#   (Calico) that permits broad egress, this NamespacePolicy provides an
#   additional layer of defence.  The base egress rules are still the minimum
#   required contract; confirm with your networking team that the cluster-level
#   policy does not override them.
#
# ⚠️  WARNING: This file is an overlay that STRICTENS the base policy.
#   Do NOT remove or broaden rules here without a security review.
#
# Prerequisites:
#   - Identify your cloud load-balancer egress IP ranges:
#       GKE:    kubectl get svc -A | grep -i loadbalancer
#               gcloud compute addresses list --filter="purpose=LOAD_BALANCER"
#       EKS:    aws ec2 describe-addresses --query 'Addresses[*].PublicIp'
#       AKS:    az network public-ip list --query '[?ipConfiguration!=null].[ipAddress]'
#   - Identify your model-provider egress CIDRs:
#       OpenAI:    https://openai.com/api/policies/ip-allowlist/
#                  Current known range: 23.102.140.112/28 (verify)
#       Anthropic: https://docs.anthropic.com/en/docs/about-credentials/security
#       Vertex AI: https://cloud.google.com/compute/docs/ip-addresses
#                  GCP NAT IP ranges (your project's Cloud NAT configuration)
#
# Apply:  kubectl apply -k k8s/overlays/prod
#         (this overlay is included via kustomization.yaml)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsswarm-network-policy-prod
  namespace: opsswarm
  labels:
    app.kubernetes.io/name: opsswarm
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/version: "2.2.0"
    environment: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opsswarm

  ingress:
    # ── Production ingress-controller allowlist ────────────────────────────
    # Do not use 0.0.0.0/0 (even with RFC1918 exceptions): that still permits
    # arbitrary public source addresses.  Label the namespace hosting the
    # production ingress controller before applying this overlay:
    #
    #   kubectl label namespace <ingress-namespace> \
    #     opsswarm.io/production-ingress=true
    #
    # This policy is additive to the base same-namespace/explicit-namespace
    # allowlists and limits external traffic to that deliberately labelled
    # namespace.  A cloud-specific IP allowlist belongs in a separately
    # reviewed overlay once the actual provider CIDRs are known.
    - from:
        - namespaceSelector:
            matchLabels:
              opsswarm.io/production-ingress: "true"
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # ── Model provider egress ─────────────────────────────────────────────
    # OpsSwarm, via OpenClaw, calls LLM provider APIs.  These are the verified
    # destinations for the three supported providers.  Un-comment only the
    # providers you use.
    #
    # OpenAI API:
    #   Current known CIDRs (verify at https://openai.com/api/policies/ip-allowlist/):
    #   - 23.102.140.112/28  (OpenAI tier 1)
    #   - 104.19.x.x/22      (Akamai CDN / OpenAI CDN)
    #   Alternatively: allow TCP 443 to *.openai.com via DNS-based policy
    #   if your CNI supports domain-based egress rules (Cilium, Calico Enterpise).
    #
    # Anthropic API:
    #   Allow TCP 443 to *.anthropic.com (verify CIDRs in Anthropic docs).
    #   No specific CIDR block published; use DNS-based policy or broad 443
    #   allowance if your CNI supports it.
    #
    # Vertex AI (GCP):
    #   Allow TCP 443 to *.googleapis.com.
    #   Your Cloud NAT IP is the egress IP; add it to the cloud metadata rule.
    #
    # NOTE: If your CNI does not support domain-based egress rules, use the
    # DNS-based approach by allowing TCP 53 to your cluster's CoreDNS first,
    # then allow TCP 443 to the specific provider CIDRs listed above.
    #
    # Un-comment and configure the providers you use:
    #
    # OpenAI:
    # - to:
    #     - ipBlock:
    #         cidr: 23.102.140.112/28
    #   ports:
    #     - protocol: TCP
    #       port: 443
    # - to:
    #     - ipBlock:
    #         cidr: 104.19.0.0/16
    #   ports:
    #     - protocol: TCP
    #       port: 443
    #
    # Anthropic (use DNS-based rule if CNI supports it):
    # - to:
    #     - ipBlock:
    #         cidr: 0.0.0.0/0
    #   ports:
    #     - protocol: TCP
    #       port: 443
    #   # NOTE: Anthropic does not publish specific CIDRs.  This broad 443 rule
    #   # is a minimum requirement until Anthropic publishes IP ranges.
    #   # Consider restricting via DNS policy if your CNI supports it.
