[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsswarm-openclaw-github"
version = "2.2.0"
description = "OpsSwarm Enterprise: OpenClaw + GitHub Incident Control Architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
]

[project.scripts]
opsswarm = "opsswarm.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "packaging==25.0",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]
ha = [
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
]
release = [
    "build==1.3.0",
    "cyclonedx-bom==7.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Pure function tests with no I/O",
    "normal: Normal operational path tests",
    "boundary: Edge case and boundary condition tests",
    "contract: Skill contract validation tests",
    "integration: Multi-component tests with fakes",
    "e2e: Full system tests with real HTTP/process",
    "fault: Fault injection and recovery tests",
    "cross_skill: Tests spanning multiple skills",
    "security: Authorization and authentication tests",
    "smoke: Quick sanity checks",
    "slow: Long-running tests",
]

[tool.coverage.run]
branch = true
source = ["opsswarm"]
omit = [
    "opsswarm/ha_db.py",   # Phase 2-6 HA implementation; tested separately in those phases
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with fail-closed correctness rules that the current source satisfies.
# Expanding this selection is expected as legacy style debt is removed.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["opsswarm"]
# Pin the analysis platform so the enforced error count is identical on the
# developer workstation and on the Linux CI runner. Without this, mypy resolves
# `fcntl` vs `msvcrt` differently per OS and the baseline gate becomes flaky.
platform = "linux"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
# Issue #124: the broad global `disable_error_code` list has been removed.
# Every mypy semantic category is now enabled by default. The remaining
# waivers are narrowly scoped per module below and each one states why the
# finding still needs to be resolved.
disable_error_code = []

# ---------------------------------------------------------------------------
# Per-module mypy waivers (Issue #124).
#
# These are the only modules that still report findings under the full
# semantic category set. Each waiver is scoped to the specific category and
# names the reason it is still outstanding. Removing a waiver requires fixing
# the corresponding finding; adding a new one must record the reason.
# ---------------------------------------------------------------------------

[[tool.mypy.overrides]]
# Two HA rate-limiter buckets share a default that mypy cannot narrow to int.
module = "opsswarm.auth"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
# A list-typed CLI option is narrowed by the caller, not by the parser.
module = "opsswarm.cli"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# PyYAML has no installed stubs, and the config loader returns a loosely typed
# mapping before validation.
module = "opsswarm.config"
disable_error_code = ["arg-type", "import-untyped"]

[[tool.mypy.overrides]]
# EvidenceStore predates strict typing: the chain signature accepts a generic
# Mapping, path fields are Optional, and the `list` method name shadows the
# builtin inside its own annotations.
module = "opsswarm.evidence"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "operator",
    "return-value",
    "union-attr",
    "valid-type",
]

[[tool.mypy.overrides]]
# Markdown node attributes are parsed from untyped front matter.
module = "opsswarm.markdown"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
# Prometheus metric labels and counters are accumulated in plain dictionaries
# that need explicit annotations.
module = "opsswarm.metrics"
disable_error_code = ["assignment", "var-annotated"]

[[tool.mypy.overrides]]
# The orchestrator still uses legacy model field names and Optional incident
# contexts on the governed remediation path.
module = "opsswarm.orchestrator"
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-arg"]

[[tool.mypy.overrides]]
# The reconciliation record is Optional until it is resolved.
module = "opsswarm.reconciliation"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
# PyYAML has no installed stubs in the current dependency set.
module = "opsswarm.registry"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Skill metadata is read from an untyped mapping at runtime.
module = "opsswarm.skill_logic"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# The run store lock uses platform-specific file locking primitives and
# resolves the current run record optionally.
module = "opsswarm.store"
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
# PyYAML has no installed stubs in the current dependency set.
module = "opsswarm.tool_allowlist"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# PyYAML has no installed stubs, and the validator accepts a loosely typed
# payload before validation.
module = "opsswarm.validators"
disable_error_code = ["arg-type", "import-untyped"]

[tool.setuptools.packages.find]
include = ["opsswarm*"]
