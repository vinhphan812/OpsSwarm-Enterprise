[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsswarm-openclaw-github"
version = "2.1.0"
description = "OpsSwarm Enterprise: OpenClaw + GitHub Incident Control Architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]
release = [
    "build==1.3.0",
    "cyclonedx-bom==7.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Pure function tests with no I/O",
    "normal: Normal operational path tests",
    "boundary: Edge case and boundary condition tests",
    "contract: Skill contract validation tests",
    "integration: Multi-component tests with fakes",
    "e2e: Full system tests with real HTTP/process",
    "fault: Fault injection and recovery tests",
    "cross_skill: Tests spanning multiple skills",
    "security: Authorization and authentication tests",
    "smoke: Quick sanity checks",
    "slow: Long-running tests",
]

[tool.coverage.run]
branch = true
source = ["opsswarm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with fail-closed correctness rules that the current source satisfies.
# Expanding this selection is expected as legacy style debt is removed.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["opsswarm"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "import-untyped",
    "index",
    "misc",
    "operator",
    "return-value",
    "union-attr",
    "valid-type",
    "var-annotated",
]

[tool.setuptools.packages.find]
include = ["opsswarm*"]
